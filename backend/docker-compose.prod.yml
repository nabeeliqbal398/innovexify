# Production override: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  db:
    # The API reaches the database over the compose network, so no host port is published.
    ports: !reset []

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      # The host is `db` here, not `localhost`.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public&connection_limit=${DB_CONNECTION_LIMIT:-10}
      # Empty by default: behind a same-origin proxy the browser needs no CORS, so the API sends no CORS headers at all.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      APP_URL: ${APP_URL}
      # Number of reverse proxies in front of the API that add the client address to X-Forwarded-For (false when none; see ../GO-LIVE.md, item 2).
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Production sends real email; the API refuses to start with MAIL_TRANSPORT=log or with SMTP settings missing.
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STORAGE_DIR: /app/storage
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
    volumes:
      # Client documents. Back this volume up together with the database: a document row without its file is a broken document.
      - uploads:/app/storage
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  uploads:
