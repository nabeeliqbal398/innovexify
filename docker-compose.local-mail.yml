# Try the production stack on ONE machine without a mail provider: a catch-all mail server (Mailpit) that shows every email in a web page.
#   docker compose -f docker-compose.yml -f docker-compose.local-mail.yml up -d --build
#   open http://localhost:8025 to read the invitation and password-reset emails
# This is for a trial run only. Real deployments set the SMTP_* values of a mail provider in .env instead (GO-LIVE.md, item 6).
services:
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  api:
    depends_on:
      mailpit:
        condition: service_started
    environment:
      MAIL_TRANSPORT: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USER: local
      SMTP_PASSWORD: local
      MAIL_FROM: "Innovexify (local trial) <no-reply@localhost>"
      # The trial mail server has no TLS.
      SMTP_ALLOW_PLAINTEXT: "true"
